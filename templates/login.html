<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduPath - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/signup.css" />
</head>

<body>

    <body>

        <div class="signup-container">

            <!-- Left Panel -->
            <div class="left-panel">
                <div class="logo-box">
                    <img src="/static/images/Logo design for CGPA Hub-Photoroom.png" class="logo-icon" />
                    <p></p>
                    <img src="/static/images/EduPath.png" alt="EduPath Logo" class="logo_name" />
                </div>
            </div>

            <!-- Right Panel -->
            <div class="right-panel">

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                <div class="flash-box">
                    {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">
                        {{ message|safe }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}

                <form class="login-form" method="POST" action="{{ url_for('auth.login') }}">
                    <h2>Login</h2>

                    <label>Email</label>
                    <input type="email" name="email" placeholder="username@gmail.com" required />

                    <label>Password</label>
                    <div class="password-box">
                        <input type="password" name="password" id="password" placeholder="password" required />
                        <i class="bi bi-eye-slash eye-icon" onclick="togglePassword()"></i>
                    </div>

                    <p class="forgot-text">
                        <a href="{{ url_for('auth.forgot_password') }}">Forgot Password</a>
                    </p>


                    <button type="submit">Login</button>

                    <p class="signup-text">
                        Don't have an account yet?
                        <a href="{{ url_for('auth.register') }}">Register for free</a>
                    </p>

                </form>

            </div>

        </div>
        <script>
            function togglePassword() {
                const input = document.getElementById("password");
                const icon = document.querySelector(".eye-icon");

                if (input.type === "password") {
                    input.type = "text";
                    icon.classList.remove("bi-eye-slash");
                    icon.classList.add("bi-eye");
                } else {
                    input.type = "password";
                    icon.classList.remove("bi-eye");
                    icon.classList.add("bi-eye-slash");
                }
            }
        </script>
    </body>

</html>
