<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduPath{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
        {% block styles %}{% endblock %}      
</head>

<body>

    <!-- PUBLIC NAVBAR -->
    <nav class="navbar">
        <div class="brand">
            <img src="{{ url_for('static', filename='images/Logo design for CGPA Hub-Photoroom.png') }}" class="logo_design">
            <img src="{{ url_for('static', filename='images/EduPath.png') }}" class="logo_text">
        </div>

        <div class="nav-links">
            <a href="{{ url_for('auth.register') }}" class="register-btn">Register</a>
            <a href="{{ url_for('auth.login') }}" class="login-btn">Login</a>
        </div>
    </nav>
        {% block content %}{% endblock %}

    <!-- FOOTER -->
    <footer id="contact">
        <p>© 2026 EduPath. All rights reserved.</p>

        <div class="footer-links">
            <a href="/about">About Us</a>
            <a href="/contact">Contact Us</a>
            <a href="/privacy">Privacy Policy</a>
        </div>
    </footer>
    </body>

</html>
