<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduPath{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
        {% block styles %}{% endblock %}      
</head>

<body>

    <!-- PUBLIC NAVBAR -->
    <nav class="navbar">
        <a href="{{ url_for('landing') }}" class="brand" aria-label="EduPath home">
            <img src="{{ url_for('static', filename='images/Logo design for CGPA Hub-Photoroom.png') }}" class="logo_design" alt="">
            <img src="{{ url_for('static', filename='images/EduPath.png') }}" class="logo_text" alt="EduPath">
        </a>

        <div class="nav-pages" aria-label="Site pages">
            <a href="{{ url_for('info.about') }}" class="{% if active_page == 'about' %}is-active{% endif %}">About Us</a>
            <a href="{{ url_for('info.contact') }}" class="{% if active_page == 'contact' %}is-active{% endif %}">Contact Us</a>
            <a href="{{ url_for('info.privacy') }}" class="{% if active_page == 'privacy' %}is-active{% endif %}">Privacy Policy</a>
        </div>

        <div class="nav-links">
            <a href="{{ url_for('auth.register') }}" class="register-btn">Register</a>
            <a href="{{ url_for('auth.login') }}" class="login-btn">Login</a>
        </div>
    </nav>
        {% block content %}{% endblock %}

    <!-- FOOTER -->
    <footer>
        <p>© 2026 EduPath. All rights reserved.</p>
    </footer>
    </body>

</html>
